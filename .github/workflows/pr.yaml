name: "pull_request"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GOLANG_VERSION: '1.27'

jobs:

  check-commit-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Commit Format
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '^(EPMDEDP-\d+: (fix|feat|docs|style|refactor|test|chore)(!)?: .+|(chore|build)(\(deps\))?: Bump .+)$'
          error: 'Commit title must match "EPMDEDP-<ID>: <type>: <description>" (example: "EPMDEDP-<ID>: feat: add feature") or a Dependabot title ("chore: Bump ...").'
          excludeDescription: 'true'
          excludeTitle: 'true'
          checkAllCommitMessages: 'true'
          accessToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Line Length
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '^.{10,85}$'
          error: 'Commit title must be between 10 and 85 characters long.'
          excludeDescription: 'true'
          excludeTitle: 'true'
          checkAllCommitMessages: 'true'
          accessToken: ${{ secrets.GITHUB_TOKEN }}

  helm-docs:
    needs: [check-commit-message]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # helm-docs is installed with go install; the Makefile pins its version.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true

      - name: Validate chart docs
        run: make validate-docs

  chart-testing:
    needs: [helm-docs]
    runs-on: ubuntu-latest
    env:
      CHART_DIR: "deploy-templates"
      CT_CONFIGS_DIR: "ct-configs"
      CT_FILE_PATH: "ct.yaml"
      LINTCONF_FILE_PATH: "lintconf.yaml"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        run: |
          ct lint --target-branch "${{ github.event.repository.default_branch }}" \
            --charts "${CHART_DIR}/" \
            --config "${CT_CONFIGS_DIR}/${CT_FILE_PATH}" \
            --lint-conf "${CT_CONFIGS_DIR}/${LINTCONF_FILE_PATH}"

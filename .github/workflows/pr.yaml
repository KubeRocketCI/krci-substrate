name: "pull_request"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GOLANG_VERSION: '1.27'
  # Kubernetes version of e2e/kind/cluster.yaml.
  KUBECTL_VERSION: 'v1.37.0'

jobs:

  check-commit-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Commit Format
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '^(EPMDEDP-\d+: (fix|feat|docs|style|refactor|test|chore)(!)?: .+|(chore|build)(\(deps\))?: Bump .+)$'
          error: 'Commit title must match "EPMDEDP-<ID>: <type>: <description>" (example: "EPMDEDP-<ID>: feat: add feature") or a Dependabot title ("chore: Bump ...").'
          excludeDescription: 'true'
          excludeTitle: 'true'
          checkAllCommitMessages: 'true'
          accessToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Line Length
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '^.{10,85}$'
          error: 'Commit title must be between 10 and 85 characters long.'
          excludeDescription: 'true'
          excludeTitle: 'true'
          checkAllCommitMessages: 'true'
          accessToken: ${{ secrets.GITHUB_TOKEN }}

  helm-docs:
    needs: [check-commit-message]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore tools
        id: tools
        uses: actions/cache/restore@v6
        with:
          path: bin
          key: helm-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: Set up Go
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true
          cache: false

      - name: Install tools
        run: make helmdocs

      - name: Save tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: bin
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Validate chart docs
        run: make validate-docs

  chart-testing:
    needs: [helm-docs]
    runs-on: ubuntu-latest
    env:
      CHART_DIR: "deploy-templates"
      CT_CONFIGS_DIR: "ct-configs"
      CT_FILE_PATH: "ct.yaml"
      LINTCONF_FILE_PATH: "lintconf.yaml"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        run: |
          ct lint --target-branch "${{ github.event.repository.default_branch }}" \
            --charts "${CHART_DIR}/" \
            --config "${CT_CONFIGS_DIR}/${CT_FILE_PATH}" \
            --lint-conf "${CT_CONFIGS_DIR}/${LINTCONF_FILE_PATH}"

  chainsaw:
    needs: [chart-testing]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KUBECONFIG_FILE: .cache/kind-krci-substrate.kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore tools
        id: tools
        uses: actions/cache/restore@v6
        with:
          path: |
            bin
            .cache/bin
          key: e2e-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'hack/e2e-kind.sh') }}

      - name: Set up Go
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true
          cache: false

      - name: Install tools
        run: make kind chainsaw kubectl-ate

      - name: Save tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            bin
            .cache/bin
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Create kind cluster
        run: make e2e-kind-cluster-create

      - name: Install the chart and dependencies
        run: make e2e-kind-install

      - name: Run Chainsaw tests
        run: make e2e-kind-smoke

      - name: Chainsaw report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: .cache/chainsaw-smoke.xml
          check_name: Chainsaw tests
          annotate_only: true
          detailed_summary: true
          include_passed: true
          include_time_in_summary: true

      - name: Dump cluster state
        if: failure()
        run: |
          k() { kubectl --kubeconfig "${KUBECONFIG_FILE}" "$@"; }
          df -h || true
          k describe nodes || true
          k get pods -A -o wide || true
          k get events -A --sort-by=.lastTimestamp || true
          for ns in ate-system podcertificate-controller-system; do
            for pod in $(k -n "${ns}" get pods -o name 2>/dev/null); do
              echo "::group::${ns}/${pod}"
              k -n "${ns}" logs "${pod}" --all-containers --tail=200 || true
              echo "::endgroup::"
            done
          done

# Tool caches of branch main. A pull request restores caches of its own ref and of main only.
name: "tools-cache"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Same tool sets as the jobs of pr.yaml and release.yaml.
        tools:
          - helmdocs
          - git-chglog
          - kind chainsaw kubectl-ate
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Tools
        uses: ./.github/actions/tools
        with:
          tools: ${{ matrix.tools }}

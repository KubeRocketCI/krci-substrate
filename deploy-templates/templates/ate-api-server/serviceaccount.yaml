# Upstream appVersion: the ServiceAccount of manifests/ate-install/ate-api-server.yaml.
# Chart values: apiServer.serviceAccount.annotations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-api-server
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "control-dataplane" | nindent 4 }}
    {{- with .Values.apiServer.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

# Upstream: the ServiceAccounts ate-client and ate-controller of manifests/ate-install/ate-controller.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-client
  namespace: ate-system
  labels:
    apps: ate-client
  annotations:
    {{- include "krci-substrate.syncWave" "control-dataplane" | nindent 4 }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-controller
  namespace: ate-system
  labels:
    apps: ate-controller
  annotations:
    {{- include "krci-substrate.syncWave" "control-dataplane" | nindent 4 }}


# Upstream: the Service of manifests/ate-install/ate-idp-server.yaml.
apiVersion: v1
kind: Service
metadata:
  name: idp
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "control-dataplane" | nindent 4 }}
spec:
  selector:
    app: ate-idp-server
  ports:
  - name: https
    port: 443
    targetPort: https
    appProtocol: https

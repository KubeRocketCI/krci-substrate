# Upstream: the ClusterRole, ClusterRoleBinding, Role and RoleBinding of manifests/ate-install/atelet.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atelet
  annotations:
    {{- include "krci-substrate.syncWave" "postgres-atelet" | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["ate.dev"]
  resources: ["csidriverconfigs"]
  verbs: ["get", "list", "watch"]
# Sandbox asset prewarm on the node; sandbox runtimes file of each local worker.
- apiGroups: ["ate.dev"]
  resources: ["sandboxconfigs"]
  verbs: ["get", "list", "watch"]
# The SandboxConfig of each local worker's pool.
- apiGroups: ["ate.dev"]
  resources: ["workerpools"]
  verbs: ["get", "list", "watch"]
# Sync failures: Warning Events on the worker pod.
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
# ClusterTrustBundles of SystemInfo trustBundle data sources, projected into actors.
- apiGroups: ["certificates.k8s.io"]
  resources: ["clustertrustbundles"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atelet
  annotations:
    {{- include "krci-substrate.syncWave" "postgres-atelet" | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: atelet
  namespace: ate-system
roleRef:
  kind: ClusterRole
  name: atelet
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atelet-endpointslices
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "postgres-atelet" | nindent 4 }}
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atelet-endpointslices
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "postgres-atelet" | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: atelet
  namespace: ate-system
roleRef:
  kind: Role
  name: atelet-endpointslices
  apiGroup: rbac.authorization.k8s.io

# Upstream: the ResourceQuota of manifests/ate-install/atelet.yaml.
# atelet runs at system-cluster-critical. Clusters whose ResourceQuota admission limits the critical
# classes (GKE) admit such pods only in a namespace with a quota of that class. The limit never blocks atelet.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: atelet-critical-pods
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "postgres-atelet" | nindent 4 }}
spec:
  hard:
    pods: 1G
  scopeSelector:
    matchExpressions:
    - scopeName: PriorityClass
      operator: In
      values: ["system-node-critical", "system-cluster-critical"]

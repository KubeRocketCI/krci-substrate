# Upstream: the ServiceAccount of manifests/ate-install/atelet.yaml.
# Chart values: atelet.serviceAccount.annotations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atelet
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "postgres-atelet" | nindent 4 }}
    {{- with .Values.atelet.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

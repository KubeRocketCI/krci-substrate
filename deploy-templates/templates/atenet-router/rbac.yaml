# Upstream appVersion: the Role and RoleBinding of manifests/ate-install/atenet-router.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atenet-router-endpointslices
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "control-dataplane" | nindent 4 }}
rules:
- apiGroups:
  - "discovery.k8s.io"
  resources:
  - endpointslices
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atenet-router-endpointslices
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "control-dataplane" | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: atenet-router
  namespace: ate-system
roleRef:
  kind: Role
  name: atenet-router-endpointslices
  apiGroup: rbac.authorization.k8s.io

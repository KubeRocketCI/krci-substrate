# Upstream: the Service of manifests/ate-install/atenet-router.yaml.
apiVersion: v1
kind: Service
metadata:
  name: atenet-router
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "control-dataplane" | nindent 4 }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: atenet-router
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: connect-tls
    port: 8444
    targetPort: 8444
    protocol: TCP

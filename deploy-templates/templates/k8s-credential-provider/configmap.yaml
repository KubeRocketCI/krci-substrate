# Upstream appVersion: manifests/egress-credential-injection/namespace-policy.yaml.
# Chart changes: policies from credentialProvider.namespacePolicies; the chart owns the ConfigMap.
# Default deny: an atespace not listed resolves no Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-credential-provider-namespace-policy
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "control-dataplane" | nindent 4 }}
data:
  namespace-policy.yaml: |
    # No atespace may resolve any Secret until it is listed here, for example:
    #
    #   policies:
    #   - atespace: team-a
    #     allowedNamespaces:
    #     - ns1
    policies: {{ .Values.credentialProvider.namespacePolicies | default list | toJson }}

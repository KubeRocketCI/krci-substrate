# Upstream: the NetworkPolicy of manifests/egress-credential-injection/k8s-credential-provider.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-credential-provider
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "base" | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: k8s-credential-provider
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - protocol: TCP
      port: 50051

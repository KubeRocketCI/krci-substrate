# Upstream appVersion: the ClusterRole and ClusterRoleBinding of manifests/egress-credential-injection/k8s-credential-provider.yaml.
# Read on Secrets in every namespace: a namespace policy can name a Secret in any namespace.
# The only component of egress credential injection with Kubernetes access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-credential-provider-secret-reader
  annotations:
    {{- include "krci-substrate.syncWave" "control-dataplane" | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-credential-provider-secret-reader
  annotations:
    {{- include "krci-substrate.syncWave" "control-dataplane" | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-credential-provider-secret-reader
subjects:
- kind: ServiceAccount
  name: k8s-credential-provider
  namespace: ate-system

{{- $pki := include "krci-substrate.pools" . | fromYaml }}
{{- range $pki.pools }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secret }}
  namespace: {{ .namespace }}
  annotations:
    {{- include "krci-substrate.syncWave" "pki" | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.pki.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: krci-substrate-pki
  target:
    name: {{ .secret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      {{- if eq .format "caPool" }}
      type: kubernetes.io/tls
      data:
        pool: {{ include "krci-substrate.caPoolJSON" . | squote }}
        tls.crt: {{ `{{ .tlsCrt }}` | squote }}
        tls.key: {{ `{{ .tlsKey }}` | squote }}
      {{- else if eq .format "caCerts" }}
      type: Opaque
      data:
        ca.crt: {{ `{{ .tlsCrt | filterPEM "CERTIFICATE" }}` | squote }}
      {{- else }}
      type: Opaque
      data:
        pool: {{ include "krci-substrate.jwtPoolJSON" . | squote }}
      {{- end }}
  data:
    - secretKey: tlsCrt
      remoteRef:
        key: {{ .source }}
        property: tls.crt
    {{- if ne .format "caCerts" }}
    - secretKey: tlsKey
      remoteRef:
        key: {{ .source }}
        property: tls.key
    {{- end }}
{{- end }}

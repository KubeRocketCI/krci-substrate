{{- $pki := include "krci-substrate.pools" . | fromYaml }}
{{- range $namespace := $pki.namespaces }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: krci-substrate-selfsigned
  namespace: {{ $namespace }}
  annotations:
    {{- include "krci-substrate.syncWave" "pki" | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}

{{- $pki := include "krci-substrate.pools" . | fromYaml }}
{{- range $namespace := $pki.namespaces }}
{{- $sources := list }}
{{- range $pki.pools }}
{{- if eq .namespace $namespace }}
{{- $sources = append $sources .source }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krci-substrate-pki
  namespace: {{ $namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krci-substrate-pki
  namespace: {{ $namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      {{- range uniq $sources }}
      - {{ . }}
      {{- end }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: krci-substrate-pki
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: krci-substrate-pki
subjects:
  - kind: ServiceAccount
    name: krci-substrate-pki
    namespace: {{ $namespace }}
{{- end }}

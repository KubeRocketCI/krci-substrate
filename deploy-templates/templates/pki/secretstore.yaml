{{- $pki := include "krci-substrate.pools" . | fromYaml }}
{{- range $namespace := $pki.namespaces }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: krci-substrate-pki
  namespace: {{ $namespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $namespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: krci-substrate-pki
{{- end }}

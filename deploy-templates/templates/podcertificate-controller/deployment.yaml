# Upstream appVersion: the Deployment of manifests/ate-install/pod-certificate-controller.yaml.
# Reference install changes: release image, --preview= (ate-setup).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podcertificate-controller
  namespace: podcertificate-controller-system
  labels:
    app: podcertificate-controller
  annotations:
    {{- include "krci-substrate.syncWave" "pki" | nindent 4 }}
spec:
  replicas: {{ .Values.podcertificateController.replicas }}
  selector:
    matchLabels:
      app: podcertificate-controller
  template:
    metadata:
      labels:
        app: podcertificate-controller
    spec:
      containers:
      - name: controller
        image: {{ include "krci-substrate.image" (dict "image" .Values.podcertificateController.image "path" "podcertificateController.image") }}
        args:
        - --in-cluster=true
        - --sharding-pod-namespace=$(POD_NAMESPACE)
        - --sharding-pod-name=$(POD_NAME)
        - --sharding-pod-uid=$(POD_UID)
        - --sharding-application-name=podcertificate-controller
        - --service-dns-ca-pool=/run/ca-state/service-dns-pool.json
        - --pod-identity-ca-pool=/run/ca-state/pod-identity-pool.json
        - --postgres-ca-pool=/run/ca-state/postgres-pool.json
        - --postgres-client-namespace=ate-system
        - --workers-per-signer=$(WORKERS_PER_SIGNER)
        - --preview=
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: WORKERS_PER_SIGNER
          value: "1"
        volumeMounts:
        - name: "ca-state"
          mountPath: "/run/ca-state"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: "ca-state"
        projected:
          sources:
          - secret:
              name: "service-dns-ca-pool"
              items:
              - key: "pool"
                path: "service-dns-pool.json"
          - secret:
              name: "pod-identity-ca-pool"
              items:
              - key: "pool"
                path: "pod-identity-pool.json"
          - secret:
              name: "postgres-ca-pool"
              items:
              - key: "pool"
                path: "postgres-pool.json"
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: podcertificate-controller
      terminationGracePeriodSeconds: 30

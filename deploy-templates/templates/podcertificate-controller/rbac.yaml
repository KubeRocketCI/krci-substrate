# Upstream appVersion: the ClusterRole, ClusterRoleBinding, Role and RoleBinding of
# manifests/ate-install/pod-certificate-controller.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podcert-ate-dev-signer
  annotations:
    {{- include "krci-substrate.syncWave" "pki" | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - services
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - certificates.k8s.io
  resources:
  - clustertrustbundles
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests/status
  verbs:
  - update
- apiGroups:
  - certificates.k8s.io
  resources:
  - signers
  resourceNames:
  - servicedns.podcert.ate.dev/*
  - podidentity.podcert.ate.dev/*
  - postgres.podcert.ate.dev/*
  verbs:
  - sign
  - attest
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podcert-ate-dev-signer
  annotations:
    {{- include "krci-substrate.syncWave" "pki" | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: podcert-ate-dev-signer
subjects:
- kind: ServiceAccount
  namespace: podcertificate-controller-system
  name: podcertificate-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: podcertificate-controller-system
  name: coordinator
  annotations:
    {{- include "krci-substrate.syncWave" "pki" | nindent 4 }}
rules:
- apiGroups:
  - "coordination.k8s.io"
  resources:
  - "leases"
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podcertificate-controller-is-a-coordinator
  namespace: podcertificate-controller-system
  annotations:
    {{- include "krci-substrate.syncWave" "pki" | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coordinator
subjects:
- kind: ServiceAccount
  namespace: podcertificate-controller-system
  name: podcertificate-controller

# Upstream appVersion: the Service of manifests/ate-install/postgres/postgres.yaml.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "postgres-atelet" | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432

# Upstream appVersion: the StatefulSet of manifests/ate-install/postgres/postgres.yaml.
# Reference install changes: claim StorageClass (ate-setup --postgres-storage-class).
# Chart changes: postgres.resources, postgres.storage; volume setup at /docker-entrypoint-initdb.d
# (ConfigMap postgres-setup, ADR-0002).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ate-system
  annotations:
    {{- include "krci-substrate.syncWave" "postgres-atelet" | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        # Group of the projected certificate and the data volume. OnRootMismatch: no walk of PGDATA
        # on every start, which would leave it group-writable and postgres refusing to run.
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      # tls-reloader: PostgreSQL re-reads TLS files only on SIGHUP; the sidecar reloads the server
      # after the kubelet rotates the projected pod certificate.
      # fsGroup lands the key at root:postgres 0640, the only shared mode PostgreSQL accepts while the
      # containers do not share one non-root user. Do not pin runAsUser on the postgres container: the key
      # becomes postgres-owned and group-readable, which PostgreSQL rejects.
      # https://www.postgresql.org/docs/current/ssl-tcp.html#SSL-SETUP
      initContainers:
      - name: tls-reloader
        restartPolicy: Always
        image: {{ include "krci-substrate.image" (dict "image" .Values.postgres.image "path" "postgres.image") }}
        securityContext:
          runAsUser: 70
        env:
        - name: POSTGRES_USER
          value: postgres
        command:
        - /bin/sh
        - /etc/postgresql/reload-tls.sh
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: postgres-ca
          mountPath: /run/postgres.podcert.ate.dev
          readOnly: true
        - name: socket
          mountPath: /var/run/postgresql
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      containers:
      - name: postgres
        image: {{ include "krci-substrate.image" (dict "image" .Values.postgres.image "path" "postgres.image") }}
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -ec
              - |
                until psql -U "${POSTGRES_USER}" -d postgres -Atc 'SELECT 1' >/dev/null 2>&1; do
                  sleep 1
                done
                if ! psql -U "${POSTGRES_USER}" -d postgres -Atc \
                  "SELECT 1 FROM pg_database WHERE datname = 'atepg'" | grep -qx 1; then
                  createdb -U "${POSTGRES_USER}" atepg
                fi
        env:
        - name: POSTGRES_DB
          value: atepg
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            # The image's temporary initialization server is socket-only.
            - nc -z 127.0.0.1 5432
          initialDelaySeconds: 2
          periodSeconds: 2
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - pg_isready -U "${POSTGRES_USER}" -d postgres
          initialDelaySeconds: 10
          periodSeconds: 10
        args:
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: postgres-ca
          mountPath: /run/postgres.podcert.ate.dev
          readOnly: true
        - name: socket
          mountPath: /var/run/postgresql
        - name: data
          mountPath: /var/lib/postgresql/data
        # The image entrypoint runs the scripts once, on an empty data directory.
        - name: setup
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        # One database for the whole control plane; sustains several cores under activation load.
        resources:
          {{- toYaml .Values.postgres.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: postgres-config
      - name: setup
        configMap:
          name: postgres-setup
      - name: servicedns
        projected:
          # 0600 plus the fsGroup group read: 0640.
          defaultMode: 0600
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      # Unix socket directory, shared so the sidecar can reload the server. Image default path.
      - name: socket
        emptyDir: {}
      - name: postgres-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: postgres.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- with .Values.postgres.storage.storageClassName }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests:
          # Headroom against WAL churn: a full pg_wal is a PANIC that drops every connection.
          # Size also scales provisioned IOPS/throughput on PD-backed storage classes.
          storage: {{ .Values.postgres.storage.size | quote }}

# Defaults: reference install of the chart appVersion. Bump image tags and digests with it.

podcertificateController:
  image:
    # -- Image repository.
    repository: ghcr.io/agent-substrate/substrate/podcertcontroller
    # -- Image tag.
    tag: v1.0.1
    # -- Image digest `sha256:<64 hex>`. Empty: tag only.
    digest: sha256:46aa01a624053c23080da41ea37937afc5b544cecf77088ab2196b4ffb734b4f
  # -- Replica count.
  replicas: 1

# PKI: pool Secrets from cert-manager and ESO (ADR-0001).
pki:
  certManager:
    # -- Lifetime of each CA certificate (upstream: 365 days).
    duration: 8760h
    # -- Renewal lead time before CA certificate expiry. Renewal keeps the private key.
    renewBefore: 720h
  externalSecrets:
    # -- Interval at which ESO re-reads CA certificate Secrets into pool Secrets.
    refreshInterval: 1h

# Bundled PostgreSQL: StatefulSet postgres, one replica.
postgres:
  image:
    # -- Image repository, shared by PostgreSQL and the tls-reloader sidecar.
    repository: postgres
    # -- Image tag.
    tag: 18-alpine
    # -- Image digest `sha256:<64 hex>`. Empty: tag only.
    digest: sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
  # -- Upstream base. Sized for the activation load of the whole control plane.
  resources:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "16"
      memory: 2Gi
  storage:
    # -- Upstream base. Headroom for WAL churn; also scales provisioned IOPS on some storage classes.
    size: 500Gi
    # -- Empty: cluster default StorageClass.
    storageClassName: ""

apiServer:
  image:
    # -- Image repository.
    repository: ghcr.io/agent-substrate/substrate/ateapi
    # -- Image tag.
    tag: v1.0.1
    # -- Image digest `sha256:<64 hex>`. Empty: tag only.
    digest: sha256:5d9f6da2e1446766a48908764891cc3c66cc6ff657279415c0d3839d5e9476ee
  # -- Replica count.
  replicas: 2
  # -- Required. Issuer of ServiceAccount tokens (`iss` claim, exact match, `https://`). EKS: the cluster OIDC issuer URL. Other clusters: `issuer` of `kubectl get --raw /.well-known/openid-configuration`.
  serviceAccountIssuer: ""
  # -- Comma-separated principals granted owner on global:root. Default: ServiceAccount ate-system/ate-client, the token `kubectl ate` mints. Shared install: the operator principals.
  bootstrapOwners: system:serviceaccount:ate-system:ate-client
  serviceAccount:
    # -- ServiceAccount annotations. IRSA: `eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>`.
    annotations: {}
  objectstorePlugin:
    image:
      # -- Image repository.
      repository: ghcr.io/agent-substrate/substrate/objectstore-plugin
      # -- Image tag.
      tag: v1.0.1
      # -- Image digest `sha256:<64 hex>`. Empty: tag only.
      digest: sha256:311cc9cfb9ee8c344f3ebc3e4d5cafb88468840023b62d1c47c6338ed32b0352

idpServer:
  image:
    # -- Image repository.
    repository: ghcr.io/agent-substrate/substrate/ate-idp-server
    # -- Image tag.
    tag: v1.0.1
    # -- Image digest `sha256:<64 hex>`. Empty: tag only.
    digest: sha256:5d9302255998a3f376cbea8d8860488d20b6c030417c0c3ea7fba53a67f2c9f7
  # -- Replica count.
  replicas: 2

controller:
  image:
    # -- Image repository.
    repository: ghcr.io/agent-substrate/substrate/atecontroller
    # -- Image tag.
    tag: v1.0.1
    # -- Image digest `sha256:<64 hex>`. Empty: tag only.
    digest: sha256:b63519a821f4c702a689caf5b1ff549a8d6134ac3da94def30c71f914a70d614
  # -- Replica count.
  replicas: 1

# DaemonSet atelet: one pod per node.
atelet:
  image:
    # -- Image repository.
    repository: ghcr.io/agent-substrate/substrate/atelet
    # -- Image tag.
    tag: v1.0.1
    # -- Image digest `sha256:<64 hex>`. Empty: tag only.
    digest: sha256:f6707957b470d8a8529e65a4ec3eb1ad5182a607b313b6b1628c7fe6c0e5a9e6
  serviceAccount:
    # -- ServiceAccount annotations. IRSA: `eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>`.
    annotations: {}
  objectstorePlugin:
    image:
      # -- Image repository.
      repository: ghcr.io/agent-substrate/substrate/objectstore-plugin
      # -- Image tag.
      tag: v1.0.1
      # -- Image digest `sha256:<64 hex>`. Empty: tag only.
      digest: sha256:311cc9cfb9ee8c344f3ebc3e4d5cafb88468840023b62d1c47c6338ed32b0352
  # Image pull credentials of atelet: the kubelet credential provider plugin of the node, mounted from the host.
  imageCredentialProvider:
    # -- Mount the node credential provider and pass it to atelet. Set false on nodes without one (kind).
    enabled: true
    # -- Host directory of the credential provider binaries. Upstream default: GKE. EKS: `/etc/eks/image-credential-provider`.
    binDir: /home/kubernetes/bin
    # -- Host file of the kubelet CredentialProviderConfig. Upstream default: GKE. EKS: `/etc/eks/image-credential-provider/config.json`.
    config: /etc/srv/kubernetes/cri_auth_config.yaml

# atenet-router: the ingress gateway to actors, envoy dataplane.
router:
  image:
    # -- Image repository.
    repository: ghcr.io/agent-substrate/substrate/atenet
    # -- Image tag.
    tag: v1.0.1
    # -- Image digest `sha256:<64 hex>`. Empty: tag only.
    digest: sha256:ccfa3265be2f45d5ffa7d86ffbe32fa0976426eb1fe1bb28dffbce451c1ea5d7
  envoy:
    image:
      # -- Image repository.
      repository: ghcr.io/agent-substrate/substrate/envoy-dataplane
      # -- Image tag.
      tag: v1.0.1
      # -- Image digest `sha256:<64 hex>`. Empty: tag only.
      digest: sha256:6f59332e4e45da4b1600cf1f0c2104c595d875b661be86b4b8c5b16603ad8191
  # -- Replica count.
  replicas: 1
  # -- SPIFFE IDs of the clients the router lets reach actors. Empty: the router serves no traffic. `kubectl ate proxy actor`: `spiffe://cluster.local/ns/ate-system/sa/atenet-client`.
  ingressAllowedSpiffeIds: []

# atenet-egress: the egress gateway of actors, envoy dataplane, egress credential injection through k8s-credential-provider.
egress:
  image:
    # -- Image repository, shared by the sdsmint and ext-proc containers.
    repository: ghcr.io/agent-substrate/substrate/atenet
    # -- Image tag.
    tag: v1.0.1
    # -- Image digest `sha256:<64 hex>`. Empty: tag only.
    digest: sha256:ccfa3265be2f45d5ffa7d86ffbe32fa0976426eb1fe1bb28dffbce451c1ea5d7
  envoy:
    image:
      # -- Image repository.
      repository: ghcr.io/agent-substrate/substrate/envoy-dataplane
      # -- Image tag.
      tag: v1.0.1
      # -- Image digest `sha256:<64 hex>`. Empty: tag only.
      digest: sha256:6f59332e4e45da4b1600cf1f0c2104c595d875b661be86b4b8c5b16603ad8191
  # -- Replica count.
  replicas: 1
  # -- PEM CA certificates the egress gateway trusts for upstream TLS, in addition to the image system roots. Certificates only; a private key fails the render. Empty: system roots only.
  upstreamCA: ""

# k8s-credential-provider: resolves ate-secret:// URIs of class k8s.io to Kubernetes Secret values for the egress gateway.
credentialProvider:
  image:
    # -- Image repository.
    repository: ghcr.io/agent-substrate/substrate/kubernetes-secrets
    # -- Image tag.
    tag: v1.0.1
    # -- Image digest `sha256:<64 hex>`. Empty: tag only.
    digest: sha256:46a2872c624c6e3af98984f1097d2205f012ea6c471516ac5189ceb3adef96e5
  # -- Namespaces whose Secrets each atespace may resolve: `[{atespace: <name>, allowedNamespaces: [<namespace>]}]`. Default deny: an atespace not listed resolves no Secret. A change restarts the provider.
  namespacePolicies: []

# Snapshot storage: S3. Every objectstore-plugin sidecar (ate-api-server, atelet) gets the same S3 environment.
snapshots:
  s3:
    # -- Required. S3 bucket name rules.
    bucket: ""
    # -- Required. AWS_REGION.
    region: ""
    # -- AWS_ENDPOINT_URL. Empty: the AWS endpoint of the region.
    endpoint: ""
    # -- AWS_S3_USE_PATH_STYLE. Set for MinIO, RustFS and other S3-compatible stores.
    usePathStyle: false
    # -- Existing Secret in ate-system with keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Credentials come only from a Secret, never from values. Use only for the kind test bed or an S3-compatible store without workload identity. EKS: leave empty (AWS SDK default credential chain) and give S3 access to ate-system/ate-api-server and ate-system/atelet through EKS Pod Identity or IRSA (`<service>.serviceAccount.annotations`).
    credentialsSecret: ""

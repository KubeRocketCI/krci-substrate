# The chart objects exist and start: namespaces, CRDs, pool Secrets, trust bundles, workloads, PostgreSQL logins.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: install
spec:
  description: Chart objects of the install are present and ready.
  # Before 02-actor.
  concurrent: false
  # Existing namespace: Chainsaw neither creates nor deletes it.
  namespace: ate-system
  steps:
  - name: namespaces-and-crds
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ate-system
          status:
            phase: Active
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: podcertificate-controller-system
          status:
            phase: Active
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: workerpools.ate.dev
          status:
            (conditions[?type == 'Established'].status | [0]): "True"
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: sandboxconfigs.ate.dev
          status:
            (conditions[?type == 'Established'].status | [0]): "True"
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: csidriverconfigs.ate.dev
          status:
            (conditions[?type == 'Established'].status | [0]): "True"

  - name: pool-secrets
    description: The seven upstream pool Secrets, from cert-manager and ESO (ADR-0001).
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: service-dns-ca-pool
            namespace: podcertificate-controller-system
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pod-identity-ca-pool
            namespace: podcertificate-controller-system
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-ca-pool
            namespace: podcertificate-controller-system
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: actor-id-ca-pool
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: actor-id-ca-certs
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: actor-id-jwt-pool
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: egress-mitm-ca-pool

  - name: podcertificate-controller
    try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: podcertificate-controller
            namespace: podcertificate-controller-system
          status:
            (conditions[?type == 'Available'].status | [0]): "True"
    - assert:
        resource:
          apiVersion: certificates.k8s.io/v1
          kind: ClusterTrustBundle
          metadata:
            name: servicedns.podcert.ate.dev:identity:primary-bundle
          spec:
            (contains(trustBundle, '-----BEGIN CERTIFICATE-----')): true
    - assert:
        resource:
          apiVersion: certificates.k8s.io/v1
          kind: ClusterTrustBundle
          metadata:
            name: podidentity.podcert.ate.dev:identity:primary-bundle
          spec:
            (contains(trustBundle, '-----BEGIN CERTIFICATE-----')): true
    - assert:
        resource:
          apiVersion: certificates.k8s.io/v1
          kind: ClusterTrustBundle
          metadata:
            name: postgres.podcert.ate.dev:identity:primary-bundle
          spec:
            (contains(trustBundle, '-----BEGIN CERTIFICATE-----')): true

  - name: workloads
    description: Every chart workload in ate-system is ready.
    try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: postgres
          status:
            readyReplicas: 1
    - assert:
        resource:
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: atelet
          status:
            (numberReady == desiredNumberScheduled): true
            (updatedNumberScheduled == desiredNumberScheduled): true
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ate-api-server
          status:
            (conditions[?type == 'Available'].status | [0]): "True"
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ate-idp-server
          status:
            (conditions[?type == 'Available'].status | [0]): "True"
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ate-controller
          status:
            (conditions[?type == 'Available'].status | [0]): "True"
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: k8s-credential-provider
          status:
            (conditions[?type == 'Available'].status | [0]): "True"
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: atenet-router
          status:
            (conditions[?type == 'Available'].status | [0]): "True"
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: atenet-egress
          status:
            (conditions[?type == 'Available'].status | [0]): "True"
    - assert:
        resource:
          apiVersion: ate.dev/v1
          kind: SandboxConfig
          metadata:
            name: gvisor-default
            annotations:
              sandboxconfig.ate.dev/is-class-default: "true"

  - name: postgres-logins
    description: No role has a password; both ate-api-server logins hold TLS sessions with a client certificate.
    try:
    - script:
        content: >-
          kubectl --namespace ate-system exec postgres-0 -c postgres --
          psql -U postgres -d atepg -Atc 'SELECT count(*) FROM pg_authid WHERE rolpassword IS NOT NULL'
        check:
          ($error == null): true
          (trim_space($stdout)): "0"
    - script:
        content: >-
          kubectl --namespace ate-system exec postgres-0 -c postgres --
          psql -U postgres -d atepg -Atc "SELECT string_agg(DISTINCT a.usename, ',' ORDER BY a.usename)
          FROM pg_stat_activity a JOIN pg_stat_ssl s USING (pid) WHERE s.ssl AND s.client_dn IS NOT NULL"
        check:
          ($error == null): true
          (trim_space($stdout)): substrate_owner_user,substrate_readwrite_user

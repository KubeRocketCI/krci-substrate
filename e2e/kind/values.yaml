# Chart values for the kind test bed. S3 credentials: Secret ate-system/rustfs-credentials (rustfs.yaml), never values.

# Upstream manifests/ate-install/kind/postgres overlay.
postgres:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  storage:
    size: 1Gi

apiServer:
  # kube-apiserver --service-account-issuer of kind.
  serviceAccountIssuer: https://kubernetes.default.svc.cluster.local

# Upstream manifests/ate-install/kind/ate-api-server overlay: the RustFS S3 fixture.
snapshots:
  s3:
    bucket: ate-snapshots
    region: us-east-1
    endpoint: http://rustfs.ate-system.svc:9000
    usePathStyle: true
    credentialsSecret: rustfs-credentials

# Upstream manifests/ate-install/kind/atelet overlay: kind nodes have no credential provider plugin.
atelet:
  imageCredentialProvider:
    enabled: false

# The client identity of kubectl ate proxy actor (upstream demos/counter prerequisite).
router:
  ingressAllowedSpiffeIds:
    - spiffe://cluster.local/ns/ate-system/sa/atenet-client
